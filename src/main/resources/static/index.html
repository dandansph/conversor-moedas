<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversor de Moedas</title>
  <meta name="description" content="Conversor de moedas em tempo real com Spring Boot e a API Frankfurter.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%236366f1'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3E$%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="grid"></span>
  </div>

  <main class="shell">
    <header class="hero">
      <span class="badge"><i class="dot"></i> Cotações em tempo real</span>
      <h1>Conversor de <span class="grad">Moedas</span></h1>
      <p>Converta valores entre mais de 30 moedas com as taxas oficiais do Banco Central Europeu.</p>
    </header>

    <section class="card" aria-label="Conversor">
      <div class="field">
        <label for="amount">Valor</label>
        <div class="amount-box">
          <span class="amount-symbol" id="amountSymbol">$</span>
          <input id="amount" type="text" inputmode="decimal" autocomplete="off" value="100" aria-label="Valor a converter">
        </div>
      </div>

      <div class="pair">
        <div class="field">
          <label>De</label>
          <div class="select" id="fromSelect"></div>
        </div>

        <button class="swap" id="swap" type="button" aria-label="Inverter moedas">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-4-4M7 20l4-4M17 20V4M17 4l-4 4M17 4l4 4"/></svg>
        </button>

        <div class="field">
          <label>Para</label>
          <div class="select" id="toSelect"></div>
        </div>
      </div>

      <div class="result" id="result" aria-live="polite">
        <div class="result-label" id="resultLabel">—</div>
        <div class="result-value" id="resultValue">—</div>
        <div class="result-meta" id="resultMeta"></div>
        <div class="result-actions">
          <button class="ghost" id="copy" type="button">Copiar resultado</button>
        </div>
      </div>

      <div class="error" id="error" role="alert" hidden></div>

      <div class="quick">
        <span class="quick-title">Pares populares</span>
        <div class="chips" id="chips"></div>
      </div>
    </section>

    <section class="history" id="historyBox" hidden>
      <div class="history-head">
        <h2>Conversões recentes</h2>
        <button class="link" id="clearHistory" type="button">Limpar</button>
      </div>
      <ul id="history"></ul>
    </section>

    <footer class="foot">
      Feito com Spring Boot &amp; <a href="https://frankfurter.dev" target="_blank" rel="noopener">Frankfurter API</a>
    </footer>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
